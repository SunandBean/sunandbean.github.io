name: Weekly link check

on:
  schedule:
    - cron: "30 13 * * 1"   # Mondays 13:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: check
        run: node scripts/check-links.mjs
        continue-on-error: true
      - name: Open or update the broken-links issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create broken-links --color d73a4a --description "Found by the weekly link check" 2>/dev/null || true
          existing=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file broken-links.md
          else
            gh issue create --title "Broken links on sunandbean.com" --label broken-links --body-file broken-links.md
          fi
